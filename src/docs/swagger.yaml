  /api/deliveries:
    get:
      tags: [Deliveries]
      summary: Obtener todas las entregas
      responses:
        '200':
          description: Entregas obtenidas exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveriesResponse'
        '500':
          description: Error interno del servidor
    post:
      tags: [Deliveries]
      summary: Crear una entrega
      description: Requiere un pedido existente. El conductor es opcional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryInput'
      responses:
        '200':
          description: Entrega creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: ID inválido o datos de entrega inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                idInvalido:
                  summary: ID del pedido o conductor inválido
                  value:
                    status: error
                    message: ID inválido
                    code: ID_ERROR
                userNoDriver:
                  summary: Usuario no es un conductor
                  value:
                    status: error
                    message: Usuario no es un conductor
                    code: NON_DRIVER_USER
        '404':
          description: Pedido o conductor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                pedidoNoEncontrado:
                  summary: Pedido no encontrado
                  value:
                    status: error
                    message: Orden no encontrada
                conductorNoEncontrado:
                  summary: Conductor no encontrado
                  value:
                    status: error
                    message: Usuario no encontrado
        '500':
          description: Error interno del servidor
