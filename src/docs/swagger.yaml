  /api/mocks/getMockUsers:
    get:
      tags: [Mocks]
      summary: Generar usuarios simulados
      description: Genera usuarios de prueba sin guardarlos en MongoDB.
      parameters:
        - name: cant
          in: query
          required: false
          description: Cantidad de usuarios a generar entre 1 y 100. Por defecto es 10
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Usuarios simulados generados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockUsersResponse'
              examples:
                usuariosGenerados:
                  summary: Un usuario generado
                  value:
                    status: success
                    message: Usuarios simulados obtenidos
                    payload:
                      - firstName: Ana
                        lastName: Gomez
                        email: ana.gomez.abc12@shipnow.test
                        password: "coder123!"
                        role: customer
        '400':
          description: Cantidad de usuarios inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cantidadInvalida:
                  summary: La cantidad no es un entero positivo
                  value:
                    status: error
                    message: Cantidad de mocks inválida
                    code: INVALID_MOCK_QUANTITY
                cantidadExcedida:
                  summary: La cantidad supera el máximo permitido
                  value:
                    status: error
                    message: Se alcanzó el máximo de mocks
                    code: MAX_MOCK_REACHED
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                errorInterno:
                  summary: Error inesperado
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR
  /api/mocks/seed:
    post:
      tags: [Mocks]
      summary: Insertar datos simulados
      description: Inserta usuarios, pedidos y entregas en MongoDB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockSeedInput'
      responses:
        '200':
          description: Datos simulados insertados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockSeedResponse'
              examples:
                usuariosInsertados:
                  summary: Se insertaron dos usuarios
                  value:
                    status: success
                    message: Datos simulados insertados
                    payload:
                      users: 0
                      orders: 0
                      deliveries: 0
                      stores: 0
        '400':
          description: Cantidad inválida o datos insuficientes para la generación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cantidadInvalida:
                  summary: Una cantidad positiva no es entera
                  value:
                    status: error
                    message: Cantidad de mocks inválida
                    code: INVALID_MOCK_QUANTITY
                cantidadExcedida:
                  summary: Una cantidad supera el máximo permitido
                  value:
                    status: error
                    message: Se alcanzó el máximo de mocks
                    code: MAX_MOCK_REACHED
                clientesInsuficientes:
                  summary: No hay clientes para generar pedidos
                  value:
                    status: error
                    message: No hay suficientes clientes simulados
                    code: MOCK_NOT_ENOUGH_CLIENTS
                conductoresInsuficientes:
                  summary: No hay conductores para generar entregas
                  value:
                    status: error
                    message: No hay suficientes conductores simulados
                    code: MOCK_NOT_ENOUGH_DRIVERS
                pedidosInsuficientes:
                  summary: No hay suficientes pedidos sin entrega
                  value:
                    status: error
                    message: No hay suficientes órdenes simuladas sin entrega
                    code: MOCK_NOT_ENOUGH_ORDERS
                tiendasInsuficientes:
                  summary: No hay suficientes dueños de tiendas
                  value:
                    status: error
                    message: No hay suficientes dueños de tiendas simulados
                    code: MOCK_NOT_ENOUGH_STORE_OWNERS
        '500':
          description: Error interno del servidor, por ejemplo durante la carga en MongoDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                errorInterno:
                  summary: Error inesperado
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR
components:
  schemas:
    MockUser:
      type: object
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          format: email
          example: ana.gomez.abc12@shipnow.test
        password:
          type: string
          example: "coder123!"
        role:
          type: string
          example: customer
    MockUsersResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Usuarios simulados obtenidos
        payload:
          type: array
          items:
            $ref: '#/components/schemas/MockUser'
    MockSeedInput:
      type: object
      properties:
        users:
          type: integer
          description: Cantidad de usuarios a insertar.
          example: 0
        orders:
          type: integer
          description: Cantidad de pedidos a insertar.
          example: 0
        deliveries:
          type: integer
          description: Cantidad de entregas a insertar.
          example: 0
