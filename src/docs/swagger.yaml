tags:
  - name: Users
    description: Gestion de usuarios
  - name: Orders
    description: Gestion de pedidos
  - name: Deliveries
    description: Gestion de entregas
  - name: Stores
    description: Gestion de tiendas
  - name: Mocks
    description: Gestion de datos simulados
paths: 
  /api/users:
    get:
      tags: [Users]
      summary: Obtener todos los usuarios
      description: Obtener la lista completa de usuarios
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                errorInterno:
                  summary: Error interno del servidor
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR
    post:
      tags: [Users]
      summary: Crear un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos del usuario inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                camposFaltantes:
                  summary: Faltan campos requeridos
                  value:
                    status: error
                    message: Faltan campos requeridos
                    code: MISSING_REQUIRED_FIELDS
                emailInvalido:
                  summary: Formato de email inválido
                  value:
                    status: error
                    message: Formato de correo electrónico inválido
                    code: INVALID_EMAIL_FORMAT
                emailExistente:
                  summary: Email ya registrado
                  value:
                    status: error
                    message: El correo electrónico ya está en uso
                    code: EMAIL_EXISTS
                rolInvalido:
                  summary: Rol inválido
                  value:
                    status: error
                    message: Rol inválido
                    code: INVALID_USER_ROLE
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                errorInterno:
                  summary: Error interno del servidor
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR    
